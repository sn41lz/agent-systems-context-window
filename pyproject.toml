[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-systems-context-window"
version = "0.1.0"
description = "Cache-aware context budgeting with tiered compaction and constraint provenance."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Sergi Espí Zamora"}]
requires-python = ">=3.12"
dependencies = [
  "jsonschema==4.26.0",
  "tiktoken==0.14.0",
  "openai==3.31.0",
  "opentelemetry-sdk==1.45.1",
]

[project.optional-dependencies]
dev = [
  "build==1.6.1",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.0",
]

[project.scripts]
context-window = "context_window.cli:main"

[project.urls]
Repository = "https://github.com/sn41lz/agent-systems-context-window"
Issues = "https://github.com/sn41lz/agent-systems-context-window/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
context_window = ["py.typed", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["context_window"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/context_window"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true
